
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FlightLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #071426, #123b62);
            font-family: Arial, sans-serif;
        }
        .login-card {
            width: 90%;
            max-width: 410px;
            padding: 38px;
            border-radius: 18px;
            background: white;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
        }
        .brand {
            color: #123b62;
            font-weight: 800;
            font-size: 26px;
        }
        .form-control {
            padding: 12px;
        }
        .btn-login {
            padding: 12px;
            background: #123b62;
            color: white;
            font-weight: bold;
        }
        .btn-login:hover {
            background: #0a2947;
            color: white;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="text-center mb-4">
        <div class="brand">FLIGHTLOG</div>
        <p class="text-secondary mb-0">Aircraft Flight Log Management</p>
    </div>

    <h4 class="mb-1">Welcome back</h4>
    <p class="text-secondary mb-4">Sign in to access your dashboard.</p>

    <div th:if="${param.error}" class="alert alert-danger">
        Invalid username or password.
    </div>

    <div th:if="${param.logout}" class="alert alert-success">
        You have logged out successfully.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username"
                   class="form-control" placeholder="Enter username" required>
        </div>

        <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password"
                   class="form-control" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn btn-login w-100">Sign In</button>
    </form>

    <p class="text-center text-secondary small mt-4 mb-0">
        Authorized access only
    </p>
</div>
</body>
</html>
