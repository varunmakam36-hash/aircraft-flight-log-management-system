
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilot Form | FlightLog</title>

    <th:block th:replace="~{fragments :: styles}"></th:block>

    <style>
        .form-container {
            max-width: 850px;
            margin: 0 auto;
        }

        .form-panel {
            background: var(--card-bg, #ffffff);
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 4px 20px #172b4d12;
        }

        .form-label {
            font-weight: 600;
        }

        .page-description {
            color: #64748b;
        }

        @media (max-width: 576px) {
            .form-panel {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments :: sidebar}"></div>

<main class="main-content">
    <div class="form-container">

        <div class="mb-4">
            <a th:href="@{/pilots}" class="text-decoration-none">
                &larr; Back to Pilots
            </a>

            <h2 class="fw-bold mt-3"
                th:text="${pilot.id == null ? 'Add New Pilot' : 'Edit Pilot'}">
                Add New Pilot
            </h2>

            <p class="page-description">
                Enter the pilot's details below.
            </p>
        </div>

        <div class="form-panel">

            <div th:if="${error}"
                 class="alert alert-danger"
                 th:text="${error}">
            </div>

            <form th:action="@{/pilots/save}"
                  th:object="${pilot}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="employeeId" class="form-label">
                        Employee ID *
                    </label>

                    <input type="text"
                           id="employeeId"
                           th:field="*{employeeId}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('employeeId')} ? 'is-invalid' : ''"
                           required>

                    <div class="invalid-feedback"
                         th:errors="*{employeeId}"></div>
                </div>

                <div class="mb-3">
                    <label for="fullName" class="form-label">
                        Full Name *
                    </label>

                    <input type="text"
                           id="fullName"
                           th:field="*{fullName}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                           required>

                    <div class="invalid-feedback"
                         th:errors="*{fullName}"></div>
                </div>

                <div class="mb-3">
                    <label for="licenseNumber" class="form-label">
                        License Number *
                    </label>

                    <input type="text"
                           id="licenseNumber"
                           th:field="*{licenseNumber}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('licenseNumber')} ? 'is-invalid' : ''"
                           required>

                    <div class="invalid-feedback"
                         th:errors="*{licenseNumber}"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email *
                    </label>

                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                           required>

                    <div class="invalid-feedback"
                         th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">
                        Phone
                    </label>

                    <input type="tel"
                           id="phone"
                           th:field="*{phone}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">

                    <div class="invalid-feedback"
                         th:errors="*{phone}"></div>
                </div>

                <div class="mb-4">
                    <label for="status" class="form-label">
                        Status *
                    </label>

                    <select id="status"
                            th:field="*{status}"
                            class="form-select"
                            th:classappend="${#fields.hasErrors('status')} ? 'is-invalid' : ''"
                            required>

                        <option value="">Select Status</option>
                        <option value="Active">Active</option>
                        <option value="On Leave">On Leave</option>
                        <option value="Inactive">Inactive</option>
                    </select>

                    <div class="invalid-feedback"
                         th:errors="*{status}"></div>
                </div>

                <div class="d-flex gap-2 flex-wrap">
                    <button type="submit" class="btn btn-primary px-4">
                        Save Pilot
                    </button>

                    <a th:href="@{/pilots}"
                       class="btn btn-outline-secondary px-4">
                        Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>
</main>

</body>
</html>
