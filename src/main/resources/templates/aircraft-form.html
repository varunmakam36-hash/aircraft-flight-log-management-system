
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Form | FlightLog</title>

    <th:block th:replace="~{fragments :: styles}"></th:block>

    <style>
        .form-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .form-panel {
            background: var(--card-bg, #ffffff);
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 4px 20px #172b4d12;
        }

        .form-label {
            font-weight: 600;
        }

        .page-description {
            color: #64748b;
        }

        @media (max-width: 576px) {
            .form-panel {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments :: sidebar}"></div>

<main class="main-content">
    <div class="form-container">

        <div class="mb-4">
            <a th:href="@{/aircraft}" class="text-decoration-none">
                &larr; Back to Aircraft
            </a>

            <h2 class="fw-bold mt-3"
                th:text="${aircraft.id == null ? 'Register New Aircraft' : 'Edit Aircraft'}">
                Register New Aircraft
            </h2>

            <p class="page-description">
                Enter the aircraft details below.
            </p>
        </div>

        <div class="form-panel">

            <form th:action="@{/aircraft/save}"
                  th:object="${aircraft}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="registrationNumber" class="form-label">
                        Registration Number *
                    </label>

                    <input type="text"
                           id="registrationNumber"
                           th:field="*{registrationNumber}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('registrationNumber')} ? 'is-invalid' : ''"
                           placeholder="e.g. VT-ABC"
                           maxlength="50"
                           required>

                    <div class="invalid-feedback"
                         th:errors="*{registrationNumber}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="manufacturer" class="form-label">
                            Manufacturer *
                        </label>

                        <input type="text"
                               id="manufacturer"
                               th:field="*{manufacturer}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('manufacturer')} ? 'is-invalid' : ''"
                               placeholder="e.g. Airbus"
                               required>

                        <div class="invalid-feedback"
                             th:errors="*{manufacturer}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="model" class="form-label">
                            Aircraft Model *
                        </label>

                        <input type="text"
                               id="model"
                               th:field="*{model}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('model')} ? 'is-invalid' : ''"
                               placeholder="e.g. A320"
                               required>

                        <div class="invalid-feedback"
                             th:errors="*{model}"></div>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="status" class="form-label">
                        Aircraft Status *
                    </label>

                    <select id="status"
                            th:field="*{status}"
                            class="form-select"
                            th:classappend="${#fields.hasErrors('status')} ? 'is-invalid' : ''"
                            required>

                        <option value="">Select status</option>
                        <option value="Available">Available</option>
                        <option value="In Flight">In Flight</option>
                        <option value="Under Maintenance">Under Maintenance</option>
                        <option value="Grounded">Grounded</option>
                    </select>

                    <div class="invalid-feedback"
                         th:errors="*{status}"></div>
                </div>

                <div class="d-flex gap-2 flex-wrap">
                    <button type="submit" class="btn btn-primary px-4">
                        Save Aircraft
                    </button>

                    <a th:href="@{/aircraft}"
                       class="btn btn-outline-secondary px-4">
                        Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>
</main>

</body>
</html>
