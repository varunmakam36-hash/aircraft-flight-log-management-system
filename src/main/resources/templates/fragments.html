
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Shared sidebar -->
<aside th:fragment="sidebar" class="app-sidebar">
    <a th:href="@{/}" class="brand">
        <span class="brand-icon">✈</span>
        <span>FLIGHTLOG<small>AVIATION MANAGEMENT</small></span>
    </a>

    <div class="nav-section">WORKSPACE</div>

    <nav class="side-nav">
        <a th:href="@{/}" class="nav-link-item">
            <span>▦</span> Dashboard
        </a>
        <a th:href="@{/aircraft}" class="nav-link-item">
            <span>✈</span> Aircraft
        </a>
        <a th:href="@{/pilots}" class="nav-link-item">
            <span>♙</span> Pilots
        </a>
        <a th:href="@{/flight-logs}" class="nav-link-item">
            <span>◷</span> Flight Logs
        </a>
        <a th:href="@{/maintenance}" class="nav-link-item">
            <span>⚙</span> Maintenance
        </a>
        <a th:href="@{/reports}" class="nav-link-item">
            <span>▤</span> Reports
        </a>
    </nav>

    <div class="sidebar-bottom">
        <div class="user-info">
            <div class="avatar">A</div>
            <div class="user-label">
                <strong>Administrator</strong>
                <small>System User</small>
            </div>
        </div>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-button">
                ⇥ Sign Out
            </button>
        </form>
    </div>
</aside>

<!-- Shared styles -->
<th:block th:fragment="styles">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        :root {
            --navy: #101d35;
            --navy-light: #1a2b49;
            --blue: #3478f6;
            --page-bg: #f3f6fb;
            --text: #1d2939;
            --muted: #7b8799;
            --border: #e7ebf2;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--page-bg);
            color: var(--text);
            font-family: Inter, "Segoe UI", Arial, sans-serif;
        }

        .app-sidebar {
            position: fixed;
            inset: 0 auto 0 0;
            width: 250px;
            background: var(--navy);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 26px 17px 18px;
            z-index: 1000;
            overflow-y: auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 10px 30px;
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .brand:hover { color: white; }

        .brand-icon {
            display: grid;
            place-items: center;
            width: 43px;
            height: 43px;
            border-radius: 13px;
            background: var(--blue);
            font-size: 23px;
        }

        .brand small {
            display: block;
            margin-top: 4px;
            font-size: 9px;
            letter-spacing: 1.3px;
            color: #9caec9;
        }

        .nav-section {
            padding: 8px 12px 12px;
            color: #8291aa;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.6px;
        }

        .side-nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-link-item {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 13px 14px;
            color: #bdc8da;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            transition: background .2s, color .2s;
        }

        .nav-link-item span {
            width: 20px;
            text-align: center;
            font-size: 17px;
        }

        .nav-link-item:hover,
        .nav-link-item:focus {
            background: var(--navy-light);
            color: white;
        }

        .nav-link-item.active {
            background: var(--blue);
            color: white;
        }

        .sidebar-bottom {
            margin-top: auto;
            padding-top: 22px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 8px;
            border-top: 1px solid #2b3951;
        }

        .avatar {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #dbeafe;
            color: #1d4ed8;
            font-weight: 800;
        }

        .user-label strong,
        .user-label small { display: block; }

        .user-label strong { font-size: 12px; }
        .user-label small { color: #9caec9; font-size: 11px; }

        .logout-button {
            width: 100%;
            padding: 11px;
            border: 1px solid #39465d;
            border-radius: 9px;
            color: #d6deeb;
            background: transparent;
            text-align: left;
        }

        .logout-button:hover {
            background: #26344b;
            color: white;
        }

        .main-content {
            margin-left: 250px;
            min-height: 100vh;
            padding: 34px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 28px;
        }

        .page-title {
            margin: 0;
            font-size: 28px;
            font-weight: 750;
            letter-spacing: -.6px;
        }

        .page-subtitle {
            margin-top: 7px;
            color: var(--muted);
            font-size: 14px;
        }

        .card {
            border: 1px solid var(--border);
            border-radius: 15px;
            box-shadow: 0 4px 18px rgba(20, 39, 75, .035);
        }

        .card-header {
            padding: 18px 22px;
            background: white;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
        }

        .card-body { padding: 22px; }

        .table-responsive {
            border-radius: 12px;
        }

        .table { margin-bottom: 0; }

        .table thead th {
            padding: 14px 16px;
            background: #f7f9fc;
            color: #667085;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .7px;
            white-space: nowrap;
        }

        .table tbody td {
            padding: 14px 16px;
            vertical-align: middle;
            border-color: #edf0f5;
        }

        .table tbody tr:hover { background: #f8faff; }

        .form-control,
        .form-select {
            min-height: 43px;
            border-color: #dce3ed;
            border-radius: 9px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(52, 120, 246, .12);
        }

        .btn {
            border-radius: 9px;
            padding: 9px 16px;
            font-weight: 600;
        }

        .btn-primary {
            background: var(--blue);
            border-color: var(--blue);
        }

        @media (max-width: 900px) {
            .app-sidebar { width: 205px; }
            .main-content { margin-left: 205px; padding: 24px; }
        }

        @media (max-width: 650px) {
            .app-sidebar {
                position: relative;
                width: 100%;
                padding: 15px;
            }

            .brand { padding-bottom: 16px; }

            .side-nav {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .nav-link-item { padding: 10px; }

            .sidebar-bottom { margin-top: 15px; }

            .main-content {
                margin-left: 0;
                padding: 20px 14px;
            }

            .page-title { font-size: 23px; }
        }
    </style>
</th:block>

</body>
</html>
